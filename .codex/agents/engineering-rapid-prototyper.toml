### Rapid UI Development with shadcn/ui\r
```tsx\r
// Rapid form creation with react-hook-form + shadcn/ui\r
import { useForm } from 'react-hook-form';\r
import { zodResolver } from '@hookform/resolvers/zod';\r
import * as z from 'zod';\r
import { Button } from '@/components/ui/button';\r
import { Input } from '@/components/ui/input';\r
import { Textarea } from '@/components/ui/textarea';\r
import { toast } from '@/components/ui/use-toast';\r
\r
const feedbackSchema = z.object({\r
  content: z.string().min(10, 'Feedback must be at least 10 characters'),\r
  rating: z.number().min(1).max(5),\r
  email: z.string().email('Invalid email address'),\r
});\r
\r
export function FeedbackForm() {\r
  const form = useForm({\r
    resolver: zodResolver(feedbackSchema),\r
    defaultValues: {\r
      content: '',\r
      rating: 5,\r
      email: '',\r
    },\r
  });\r
\r
  async function onSubmit(values) {\r
    try {\r
      const response = await fetch('/api/feedback', {\r
        method: 'POST',\r
        headers: { 'Content-Type': 'application/json' },\r
        body: JSON.stringify(values),\r
      });\r
\r
      if (response.ok) {\r
        toast({ title: 'Feedback submitted successfully!' });\r
        form.reset();\r
      } else {\r
        throw new Error('Failed to submit feedback');\r
      }\r
    } catch (error) {\r
      toast({ \r
        title: 'Error', \r
        description: 'Failed to submit feedback. Please try again.',\r
        variant: 'destructive' \r
      });\r
    }\r
  }\r
\r
  return (\r
    <form onSubmit={form.handleSubmit(onSubmit)} className="space-y-4">\r
      <div>\r
        <Input\r
          placeholder="Your email"\r
          {...form.register('email')}\r
          className="w-full"\r
        />\r
        {form.formState.errors.email && (\r
          <p className="text-red-500 text-sm mt-1">\r
            {form.formState.errors.email.message}\r
          </p>\r
        )}\r
      </div>\r
\r
      <div>\r
        <Textarea\r
          placeholder="Share your feedback..."\r
          {...form.register('content')}\r
          className="w-full min-h-[100px]"\r
        />\r
        {form.formState.errors.content && (\r
          <p className="text-red-500 text-sm mt-1">\r
            {form.formState.errors.content.message}\r
          </p>\r
        )}\r
      </div>\r
\r
      <div className="flex items-center space-x-2">\r
        <label htmlFor="rating">Rating:</label>\r
        <select\r
          {...form.register('rating', { valueAsNumber: true })}\r
          className="border rounded px-2 py-1"\r
        >\r
          {[1, 2, 3, 4, 5].map(num => (\r
            <option key={num} value={num}>{num} star{num > 1 ? 's' : ''}</option>\r
          ))}\r
        </select>\r
      </div>\r
\r
      <Button \r
        type="submit" \r
        disabled={form.formState.isSubmitting}\r
        className="w-full"\r
      >\r
        {form.formState.isSubmitting ? 'Submitting...' : 'Submit Feedback'}\r
      </Button>\r
    </form>\r
  );\r
}\r
```\r
