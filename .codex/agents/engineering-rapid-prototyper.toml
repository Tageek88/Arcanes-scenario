### Instant Analytics and A/B Testing\r
```typescript\r
// Simple analytics and A/B testing setup\r
import { useEffect, useState } from 'react';\r
\r
// Lightweight analytics helper\r
export function trackEvent(eventName: string, properties?: Record<string, any>) {\r
  // Send to multiple analytics providers\r
  if (typeof window !== 'undefined') {\r
    // Google Analytics 4\r
    window.gtag?.('event', eventName, properties);\r
    \r
    // Simple internal tracking\r
    fetch('/api/analytics', {\r
      method: 'POST',\r
      headers: { 'Content-Type': 'application/json' },\r
      body: JSON.stringify({\r
        event: eventName,\r
        properties,\r
        timestamp: Date.now(),\r
        url: window.location.href,\r
      }),\r
    }).catch(() => {}); // Fail silently\r
  }\r
}\r
\r
// Simple A/B testing hook\r
export function useABTest(testName: string, variants: string[]) {\r
  const [variant, setVariant] = useState<string>('');\r
\r
  useEffect(() => {\r
    // Get or create user ID for consistent experience\r
    let userId = localStorage.getItem('user_id');\r
    if (!userId) {\r
      userId = crypto.randomUUID();\r
      localStorage.setItem('user_id', userId);\r
    }\r
\r
    // Simple hash-based assignment\r
    const hash = [...userId].reduce((a, b) => {\r
      a = ((a << 5) - a) + b.charCodeAt(0);\r
      return a & a;\r
    }, 0);\r
    \r
    const variantIndex = Math.abs(hash) % variants.length;\r
    const assignedVariant = variants[variantIndex];\r
    \r
    setVariant(assignedVariant);\r
    \r
    // Track assignment\r
    trackEvent('ab_test_assignment', {\r
      test_name: testName,\r
      variant: assignedVariant,\r
      user_id: userId,\r
    });\r
  }, [testName, variants]);\r
\r
  return variant;\r
}\r
\r
// Usage in component\r
export function LandingPageHero() {\r
  const heroVariant = useABTest('hero_cta', ['Sign Up Free', 'Start Your Trial']);\r
  \r
  if (!heroVariant) return <div>Loading...</div>;\r
\r
  return (\r
    <section className="text-center py-20">\r
      <h1 className="text-4xl font-bold mb-6">\r
        Revolutionary Prototype App\r
      </h1>\r
      <p className="text-xl mb-8">\r
        Validate your ideas faster than ever before\r
      </p>\r
      <button\r
        onClick={() => trackEvent('hero_cta_click', { variant: heroVariant })}\r
        className="bg-blue-600 text-white px-8 py-3 rounded-lg text-lg hover:bg-blue-700"\r
      >\r
        {heroVariant}\r
      </button>\r
    </section>\r
  );\r
}\r
```\r
