### Android Jetpack Compose Component\r
```kotlin\r
// Modern Jetpack Compose component with state management\r
@Composable\r
fun ProductListScreen(\r
    viewModel: ProductListViewModel = hiltViewModel()\r
) {\r
    val uiState by viewModel.uiState.collectAsStateWithLifecycle()\r
    val searchQuery by viewModel.searchQuery.collectAsStateWithLifecycle()\r
    \r
    Column {\r
        SearchBar(\r
            query = searchQuery,\r
            onQueryChange = viewModel::updateSearchQuery,\r
            onSearch = viewModel::search,\r
            modifier = Modifier.fillMaxWidth()\r
        )\r
        \r
        LazyColumn(\r
            modifier = Modifier.fillMaxSize(),\r
            contentPadding = PaddingValues(16.dp),\r
            verticalArrangement = Arrangement.spacedBy(8.dp)\r
        ) {\r
            items(\r
                items = uiState.products,\r
                key = { it.id }\r
            ) { product ->\r
                ProductCard(\r
                    product = product,\r
                    onClick = { viewModel.selectProduct(product) },\r
                    modifier = Modifier\r
                        .fillMaxWidth()\r
                        .animateItemPlacement()\r
                )\r
            }\r
            \r
            if (uiState.isLoading) {\r
                item {\r
                    Box(\r
                        modifier = Modifier.fillMaxWidth(),\r
                        contentAlignment = Alignment.Center\r
                    ) {\r
                        CircularProgressIndicator()\r
                    }\r
                }\r
            }\r
        }\r
    }\r
}\r
\r
// ViewModel with proper lifecycle management\r
@HiltViewModel\r
class ProductListViewModel @Inject constructor(\r
    private val productRepository: ProductRepository\r
) : ViewModel() {\r
    \r
    private val _uiState = MutableStateFlow(ProductListUiState())\r
    val uiState: StateFlow<ProductListUiState> = _uiState.asStateFlow()\r
    \r
    private val _searchQuery = MutableStateFlow("")\r
    val searchQuery: StateFlow<String> = _searchQuery.asStateFlow()\r
    \r
    init {\r
        loadProducts()\r
        observeSearchQuery()\r
    }\r
    \r
    private fun loadProducts() {\r
        viewModelScope.launch {\r
            _uiState.update { it.copy(isLoading = true) }\r
            \r
            try {\r
                val products = productRepository.getProducts()\r
                _uiState.update { \r
                    it.copy(\r
                        products = products,\r
                        isLoading = false\r
                    ) \r
                }\r
            } catch (exception: Exception) {\r
                _uiState.update { \r
                    it.copy(\r
                        isLoading = false,\r
                        errorMessage = exception.message\r
                    ) \r
                }\r
            }\r
        }\r
    }\r
    \r
    fun updateSearchQuery(query: String) {\r
        _searchQuery.value = query\r
    }\r
    \r
    private fun observeSearchQuery() {\r
        searchQuery\r
            .debounce(300)\r
            .onEach { query ->\r
                filterProducts(query)\r
            }\r
            .launchIn(viewModelScope)\r
    }\r
}\r
```\r
