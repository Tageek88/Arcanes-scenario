### iOS SwiftUI Component Example\r
```swift\r
// Modern SwiftUI component with performance optimization\r
import SwiftUI\r
import Combine\r
\r
struct ProductListView: View {\r
    @StateObject private var viewModel = ProductListViewModel()\r
    @State private var searchText = ""\r
    \r
    var body: some View {\r
        NavigationView {\r
            List(viewModel.filteredProducts) { product in\r
                ProductRowView(product: product)\r
                    .onAppear {\r
                        // Pagination trigger\r
                        if product == viewModel.filteredProducts.last {\r
                            viewModel.loadMoreProducts()\r
                        }\r
                    }\r
            }\r
            .searchable(text: $searchText)\r
            .onChange(of: searchText) { _ in\r
                viewModel.filterProducts(searchText)\r
            }\r
            .refreshable {\r
                await viewModel.refreshProducts()\r
            }\r
            .navigationTitle("Products")\r
            .toolbar {\r
                ToolbarItem(placement: .navigationBarTrailing) {\r
                    Button("Filter") {\r
                        viewModel.showFilterSheet = true\r
                    }\r
                }\r
            }\r
            .sheet(isPresented: $viewModel.showFilterSheet) {\r
                FilterView(filters: $viewModel.filters)\r
            }\r
        }\r
        .task {\r
            await viewModel.loadInitialProducts()\r
        }\r
    }\r
}\r
\r
// MVVM Pattern Implementation\r
@MainActor\r
class ProductListViewModel: ObservableObject {\r
    @Published var products: [Product] = []\r
    @Published var filteredProducts: [Product] = []\r
    @Published var isLoading = false\r
    @Published var showFilterSheet = false\r
    @Published var filters = ProductFilters()\r
    \r
    private let productService = ProductService()\r
    private var cancellables = Set<AnyCancellable>()\r
    \r
    func loadInitialProducts() async {\r
        isLoading = true\r
        defer { isLoading = false }\r
        \r
        do {\r
            products = try await productService.fetchProducts()\r
            filteredProducts = products\r
        } catch {\r
            // Handle error with user feedback\r
            print("Error loading products: \\(error)")\r
        }\r
    }\r
    \r
    func filterProducts(_ searchText: String) {\r
        if searchText.isEmpty {\r
            filteredProducts = products\r
        } else {\r
            filteredProducts = products.filter { product in\r
                product.name.localizedCaseInsensitiveContains(searchText)\r
            }\r
        }\r
    }\r
}\r
```\r
