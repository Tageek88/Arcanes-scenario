### Cross-Platform React Native Component\r
```typescript\r
// React Native component with platform-specific optimizations\r
import React, { useMemo, useCallback } from 'react';\r
import {\r
  FlatList,\r
  StyleSheet,\r
  Platform,\r
  RefreshControl,\r
} from 'react-native';\r
import { useSafeAreaInsets } from 'react-native-safe-area-context';\r
import { useInfiniteQuery } from '@tanstack/react-query';\r
\r
interface ProductListProps {\r
  onProductSelect: (product: Product) => void;\r
}\r
\r
export const ProductList: React.FC<ProductListProps> = ({ onProductSelect }) => {\r
  const insets = useSafeAreaInsets();\r
  \r
  const {\r
    data,\r
    fetchNextPage,\r
    hasNextPage,\r
    isLoading,\r
    isFetchingNextPage,\r
    refetch,\r
    isRefetching,\r
  } = useInfiniteQuery({\r
    queryKey: ['products'],\r
    queryFn: ({ pageParam = 0 }) => fetchProducts(pageParam),\r
    getNextPageParam: (lastPage, pages) => lastPage.nextPage,\r
  });\r
\r
  const products = useMemo(\r
    () => data?.pages.flatMap(page => page.products) ?? [],\r
    [data]\r
  );\r
\r
  const renderItem = useCallback(({ item }: { item: Product }) => (\r
    <ProductCard\r
      product={item}\r
      onPress={() => onProductSelect(item)}\r
      style={styles.productCard}\r
    />\r
  ), [onProductSelect]);\r
\r
  const handleEndReached = useCallback(() => {\r
    if (hasNextPage && !isFetchingNextPage) {\r
      fetchNextPage();\r
    }\r
  }, [hasNextPage, isFetchingNextPage, fetchNextPage]);\r
\r
  const keyExtractor = useCallback((item: Product) => item.id, []);\r
\r
  return (\r
    <FlatList\r
      data={products}\r
      renderItem={renderItem}\r
      keyExtractor={keyExtractor}\r
      onEndReached={handleEndReached}\r
      onEndReachedThreshold={0.5}\r
      refreshControl={\r
        <RefreshControl\r
          refreshing={isRefetching}\r
          onRefresh={refetch}\r
          colors={['#007AFF']} // iOS-style color\r
          tintColor="#007AFF"\r
        />\r
      }\r
      contentContainerStyle={[\r
        styles.container,\r
        { paddingBottom: insets.bottom }\r
      ]}\r
      showsVerticalScrollIndicator={false}\r
      removeClippedSubviews={Platform.OS === 'android'}\r
      maxToRenderPerBatch={10}\r
      updateCellsBatchingPeriod={50}\r
      windowSize={21}\r
    />\r
  );\r
};\r
\r
const styles = StyleSheet.create({\r
  container: {\r
    padding: 16,\r
  },\r
  productCard: {\r
    marginBottom: 12,\r
    ...Platform.select({\r
      ios: {\r
        shadowColor: '#000',\r
        shadowOffset: { width: 0, height: 2 },\r
        shadowOpacity: 0.1,\r
        shadowRadius: 4,\r
      },\r
      android: {\r
        elevation: 3,\r
      },\r
    }),\r
  },\r
});\r
```\r
