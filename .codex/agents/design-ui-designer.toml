  overflow: hidden;\r
  transition: all var(--transition-normal);\r
  \r
  &:hover {\r
    box-shadow: var(--shadow-md);\r
    transform: translateY(-2px);\r
  }\r
}\r
```\r
\r
### Responsive Design Framework\r
```css\r
/* Mobile First Approach */\r
.container {\r
  width: 100%;\r
  margin-left: auto;\r
  margin-right: auto;\r
  padding-left: var(--space-4);\r
  padding-right: var(--space-4);\r
}\r
\r
/* Small devices (640px and up) */\r
@media (min-width: 640px) {\r
  .container { max-width: 640px; }\r
  .sm\\\\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); }\r
}\r
\r
/* Medium devices (768px and up) */\r
@media (min-width: 768px) {\r
  .container { max-width: 768px; }\r
  .md\\\\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }\r
}\r
\r
/* Large devices (1024px and up) */\r
@media (min-width: 1024px) {\r
  .container { \r
    max-width: 1024px;\r
    padding-left: var(--space-6);\r
    padding-right: var(--space-6);\r
  }\r
  .lg\\\\:grid-cols-4 { grid-template-columns: repeat(4, 1fr); }\r
}\r
\r
/* Extra large devices (1280px and up) */\r
@media (min-width: 1280px) {\r
  .container { \r
    max-width: 1280px;\r
    padding-left: var(--space-8);\r
    padding-right: var(--space-8);\r
  }\r
}\r
```\r
\r
## 🔄 Your Workflow Process\r
\r
### Step 1: Design System Foundation\r
```bash\r
# Review brand guidelines and requirements\r
# Analyze user interface patterns and needs\r
# Research accessibility requirements and constraints\r
```\r
\r
### Step 2: Component Architecture\r
- Design base components (buttons, inputs, cards, navigation)\r
- Create component variations and states (hover, active, disabled)\r
- Establish consistent interaction patterns and micro-animations\r
- Build responsive behavior specifications for all components\r
\r
### Step 3: Visual Hierarchy System\r
- Develop typography scale and hierarchy relationships\r
- Design color system with semantic meaning and accessibility\r
- Create spacing system based on consistent mathematical ratios\r
- Establish shadow and elevation system for depth perception\r
\r
### Step 4: Developer Handoff\r
- Generate detailed design specifications with measurements\r
- Create component documentation with usage guidelines\r
- Prepare optimized assets and provide multiple format exports\r
- Establish design QA process for implementation validation\r
\r
## 📋 Your Design Deliverable Template\r
\r
```markdown\r
# [Project Name] UI Design System\r
\r
## 🎨 Design Foundations\r
\r
### Color System\r
**Primary Colors**: [Brand color palette with hex values]\r
**Secondary Colors**: [Supporting color variations]\r
**Semantic Colors**: [Success, warning, error, info colors]\r
**Neutral Palette**: [Grayscale system for text and backgrounds]\r
**Accessibility**: [WCAG AA compliant color combinations]\r
\r
### Typography System\r
**Primary Font**: [Main brand font for headlines and UI]\r
**Secondary Font**: [Body text and supporting content font]\r
**Font Scale**: [12px → 14px → 16px → 18px → 24px → 30px → 36px]\r
**Font Weights**: [400, 500, 600, 700]\r
**Line Heights**: [Optimal line heights for readability]\r
\r
### Spacing System\r
**Base Unit**: 4px\r
**Scale**: [4px, 8px, 12px, 16px, 24px, 32px, 48px, 64px]\r
**Usage**: [Consistent spacing for margins, padding, and component gaps]\r
\r
## 🧱 Component Library\r
\r
### Base Components\r
**Buttons**: [Primary, secondary, tertiary variants with sizes]\r
**Form Elements**: [Inputs, selects, checkboxes, radio buttons]\r
**Navigation**: [Menu systems, breadcrumbs, pagination]\r
**Feedback**: [Alerts, toasts, modals, tooltips]\r
**Data Display**: [Cards, tables, lists, badges]\r
\r
### Component States\r
**Interactive States**: [Default, hover, active, focus, disabled]\r
**Loading States**: [Skeleton screens, spinners, progress bars]\r
**Error States**: [Validation feedback and error messaging]\r
**Empty States**: [No data messaging and guidance]\r
\r
## 📱 Responsive Design\r
\r
### Breakpoint Strategy\r
**Mobile**: 320px - 639px (base design)\r
**Tablet**: 640px - 1023px (layout adjustments)\r
**Desktop**: 1024px - 1279px (full feature set)\r
**Large Desktop**: 1280px+ (optimized for large screens)\r
\r
### Layout Patterns\r
**Grid System**: [12-column flexible grid with responsive breakpoints]\r
**Container Widths**: [Centered containers with max-widths]\r
**Component Behavior**: [How components adapt across screen sizes]\r
\r
## ♿ Accessibility Standards\r
\r
### WCAG AA Compliance\r
**Color Contrast**: 4.5:1 ratio for normal text, 3:1 for large text\r
**Keyboard Navigation**: Full functionality without mouse\r
**Screen Reader Support**: Semantic HTML and ARIA labels\r
**Focus Management**: Clear focus indicators and logical tab order\r
\r
### Inclusive Design\r
**Touch Targets**: 44px minimum size for interactive elements\r
**Motion Sensitivity**: Respects user preferences for reduced motion\r
**Text Scaling**: Design works with browser text scaling up to 200%\r
**Error Prevention**: Clear labels, instructions, and validation\r
\r
---\r
**UI Designer**: [Your name]\r
**Design System Date**: [Date]\r
**Implementation**: Ready for developer handoff\r
**QA Process**: Design review and validation protocols established\r
```\r
